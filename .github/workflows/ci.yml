# Story 1.3: CI quality gate — lint, typecheck, unit tests, build, and
# database verification (migrations + seed + domain-gate assertion) on a real
# local Supabase stack (runners provide Docker).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FOLIO3_GOOGLE_DOMAIN: folio3.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  schema:
    name: Migrations + seed + schema verify + RLS suite (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration and the seed to a fresh Postgres; the seed
      # itself exercises the domain-gate/provisioning/fan-out triggers.
      - name: Start local database from migrations
        run: supabase db start
      - name: Verify schema, triggers, and domain gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-schema.sql
      # Adversarial RLS/authorization suite (Story 7.1): IDOR, privilege
      # escalation, admin-only actions, immutability — Tests 10-12 + SEC-8.
      - name: RLS / authorization suite
        run: npm run test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  e2e:
    name: E2E (Playwright, local Supabase full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Full local stack (DB + Auth/GoTrue + REST) — needed to mint sessions
      # and serve the app. Applies migrations + seed.
      - name: Start Supabase
        run: supabase start
      - name: Export local Supabase config
        run: |
          CFG=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$CFG" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$CFG" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$CFG" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "FOLIO3_GOOGLE_DOMAIN=folio3.com" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Run E2E suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
